<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utkal Laxmi — Invoice System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rose-deep:#93334f;
    --rose:#b45c78;
    --rose-mid:#c98298;
    --rose-pale:#f3d9e0;
    --blush:#fdf2ef;
    --blush-deep:#f8e3de;
    --gold:#c8a24d;
    --gold-light:#e9d7a3;
    --gold-deep:#a37f34;
    --cream:#fffbf4;
    --cream-deep:#faf1e0;
    --ink:#4a2f36;
    --ink-soft:#93777d;
    --line:#ecdfd0;
    --ok:#6f9b6a;
    --ok-bg:#eaf2e8;
    --danger:#c1615c;
    --danger-bg:#fbe9e7;
    --shadow: 0 10px 30px rgba(147,51,79,0.07);
  }
  *{box-sizing:border-box;}
  html{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  body{
    margin:0;
    font-family:'Poppins', "Segoe UI", sans-serif;
    background:var(--cream);
    color:var(--ink);
    background-image:
      radial-gradient(circle at 0 0, rgba(180,92,120,0.05) 0, transparent 55%),
      radial-gradient(circle at 100% 0, rgba(200,162,77,0.06) 0, transparent 50%);
  }

  /* ---- simple gold hairline ---- */
  .hairline{
    height:2px;
    background:linear-gradient(90deg, transparent, var(--gold) 15%, var(--gold) 85%, transparent);
    opacity:.85;
  }

  /* ---- monogram (logo mark) ---- */
  .monogram{
    position:relative;
    width:50px; height:50px; border-radius:50%; flex:none;
    background:radial-gradient(circle at 32% 28%, #fffaef, var(--gold-light) 70%);
    box-shadow:0 2px 8px rgba(0,0,0,0.18);
    display:flex; align-items:center; justify-content:center;
  }
  .monogram::after{
    content:"";
    position:absolute; inset:4px;
    border:1px solid rgba(147,51,79,0.4);
    border-radius:50%;
  }
  .monogram span{
    position:relative; z-index:1;
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:1px;
    color:var(--rose-deep);
  }
  .monogram.lg{width:66px; height:66px;}
  .monogram.lg span{font-size:20px;}
  .monogram.lg::after{inset:5px;}

  /* ---- header ---- */
  header.brandbar{
    background:linear-gradient(135deg, var(--rose-deep) 0%, #7d2a44 100%);
    color:var(--cream);
    padding:22px 34px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
  }
  .brand{display:flex; align-items:center; gap:16px;}
  .brand-word{
    font-family:'Cinzel', serif;
    letter-spacing:3.5px;
    font-size:21px;
    font-weight:600;
    line-height:1;
  }
  .brand-sub{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:13px;
    letter-spacing:1.2px;
    color:var(--gold-light);
    margin-top:6px;
  }
  nav.tabs{display:flex; gap:7px; flex-wrap:wrap;}
  nav.tabs button{
    background:rgba(255,255,255,0.09);
    border:1px solid rgba(255,255,255,0.28);
    color:var(--cream);
    padding:9px 18px;
    font-size:12px;
    letter-spacing:.5px;
    border-radius:20px;
    cursor:pointer;
    transition:.18s;
    font-family:'Poppins', inherit;
    font-weight:500;
  }
  nav.tabs button:hover{background:rgba(255,255,255,0.2);}
  nav.tabs button.active{
    background:linear-gradient(135deg, var(--gold-light), var(--gold));
    border-color:var(--gold);
    color:#5a3d16;
    font-weight:600;
    box-shadow:0 2px 8px rgba(0,0,0,0.18);
  }

  main{max-width:1080px;margin:0 auto;padding:34px 20px 90px;}
  .panel{display:none;}
  .panel.active{display:block; animation:fadein .3s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .card{
    position:relative;
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:12px;
    padding:28px 30px;
    margin-bottom:26px;
    box-shadow:var(--shadow);
  }
  .card::before{
    content:"";
    position:absolute; left:0; top:20px; bottom:20px; width:3px;
    border-radius:3px;
    background:var(--gold);
  }
  .card h2{
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:1.3px;
    color:var(--rose-deep);
    margin:0 0 6px;
    display:flex; align-items:center; gap:10px;
  }
  .card h2::before{
    content:"";
    width:14px; height:1px;
    background:var(--gold);
    display:inline-block;
  }
  .card .hint{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 20px;
    line-height:1.7;
  }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px;}
  @media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr;}}

  label{
    display:block;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.7px;
    color:var(--rose-deep);
    margin-bottom:7px;
    font-weight:600;
  }
  input[type=text], input[type=number], input[type=tel], input[type=email], input[type=date], select, textarea{
    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:7px;
    font-size:13px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
    transition:.15s;
  }
  input::placeholder{color:#c7b6ac;}
  input:hover, select:hover, textarea:hover{border-color:var(--rose-mid);}
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(200,162,77,0.18);
  }
  .field{margin-bottom:18px;}
  .field .req{color:var(--rose);}

  .btn{
    display:inline-block;
    border:none;
    padding:11px 22px;
    border-radius:24px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.5px;
    cursor:pointer;
    font-family:inherit;
    transition:.18s;
  }
  .btn-primary{background:linear-gradient(135deg, var(--rose), var(--rose-deep)); color:#fff; box-shadow:0 4px 12px rgba(147,51,79,0.25);}
  .btn-primary:hover{filter:brightness(1.06); transform:translateY(-1px);}
  .btn-gold{background:linear-gradient(135deg, var(--gold-light), var(--gold)); color:#5a3d16; box-shadow:0 4px 12px rgba(200,162,77,0.3);}
  .btn-gold:hover{filter:brightness(1.05); transform:translateY(-1px);}
  .btn-outline{background:transparent; border:1.5px solid var(--rose-mid); color:var(--rose-deep);}
  .btn-outline:hover{background:var(--rose-pale);}
  .btn-danger{background:transparent; border:1.5px solid var(--danger); color:var(--danger); padding:6px 12px; font-size:11.5px; border-radius:18px;}
  .btn-danger:hover{background:var(--danger); color:#fff;}
  .btn-sm{padding:7px 15px; font-size:11.5px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.7px;
    color:var(--rose-deep);
    padding:10px 8px;
    border-bottom:1.5px solid var(--gold);
    font-weight:700;
  }
  td{padding:13px 8px; border-bottom:1px solid var(--line); vertical-align:middle; line-height:1.5;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover td{background:var(--blush);}
  .num{text-align:right; font-variant-numeric:tabular-nums;}
  .empty-row td{text-align:center; color:var(--ink-soft); padding:28px; font-style:italic; font-family:'Cormorant Garamond', serif; font-size:15px;}

  .add-item-row{
    display:grid;
    grid-template-columns:2fr 90px 140px;
    gap:14px;
    align-items:end;
    margin-bottom:18px;
  }
  @media(max-width:600px){.add-item-row{grid-template-columns:1fr; }}

  .totals{
    margin-left:auto;
    width:320px;
    margin-top:20px;
    background:var(--blush);
    border:1px solid var(--rose-pale);
    border-radius:10px;
    padding:18px 22px;
  }
  .totals .row{display:flex; justify-content:space-between; padding:7px 0; font-size:13px;}
  .totals .row.total{
    border-top:1px solid var(--gold);
    margin-top:8px;
    padding-top:14px;
    font-family:'Cinzel', serif;
    font-size:18px;
    color:var(--rose-deep);
    font-weight:600;
    letter-spacing:.5px;
  }
  .row.discount span:last-child{color:var(--ok);}

  .coupon-row{display:flex; gap:12px; align-items:end;}
  .coupon-row .field{flex:1; margin-bottom:0;}
  .coupon-msg{font-size:12px; margin-top:9px; font-weight:500;}
  .coupon-msg.ok{color:var(--ok);}
  .coupon-msg.bad{color:var(--danger);}

  .tag{display:inline-block; padding:3px 10px; border-radius:20px; font-size:10.5px; font-weight:600;}
  .tag.active{background:var(--ok-bg); color:var(--ok);}
  .tag.inactive{background:var(--danger-bg); color:var(--danger);}

  .search-bar{margin-bottom:20px; max-width:340px;}

  .generate-card{text-align:center; background:linear-gradient(135deg, var(--blush), var(--cream-deep));}
  .generate-card h2{justify-content:center;}
  .generate-card .btn-gold{font-size:13.5px; padding:14px 36px; letter-spacing:1px;}
  .generate-card p.hint{margin-bottom:16px;}

  /* ---- Printable Invoice ---- */
  #invoiceOverlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(60,25,35,0.55);
    z-index:100;
    overflow-y:auto;
    padding:30px 14px;
  }
  #invoiceOverlay.show{display:block;}
  .invoice-modal{
    background:#e9ded0;
    max-width:calc(210mm + 24px);
    margin:0 auto;
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .invoice-toolbar{
    display:flex; justify-content:flex-end; gap:10px;
    padding:14px 22px;
    background:var(--cream-deep);
  }
  .invoice-doc{padding:12px;}

  /* decorative frame around the actual invoice — sized to A4 */
  .inv-frame{
    position:relative;
    width:210mm;
    min-height:297mm;
    margin:0 auto;
    box-sizing:border-box;
    border:1px solid var(--gold);
    background:#fffdf9;
    overflow:hidden;
    padding:16mm 16mm 14mm;
  }
  .inv-watermark{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Cinzel', serif;
    font-size:180px;
    font-weight:600;
    color:var(--rose-deep);
    opacity:.028;
    letter-spacing:14px;
    pointer-events:none;
    user-select:none;
  }
  /* simple sharp corner brackets */
  .corner{position:absolute; width:26px; height:26px; pointer-events:none;}
  .corner i{position:absolute; background:var(--gold); display:block;}
  .corner i.h{width:26px; height:1px; top:0; left:0;}
  .corner i.v{width:1px; height:26px; top:0; left:0;}
  .corner.tl{top:9mm; left:9mm;}
  .corner.tr{top:9mm; right:9mm; transform:scaleX(-1);}
  .corner.bl{bottom:9mm; left:9mm; transform:scaleY(-1);}
  .corner.br{bottom:9mm; right:9mm; transform:scale(-1,-1);}

  .inv-content{position:relative;}
  .inv-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; gap:20px;}
  .inv-brand{display:flex; gap:14px; align-items:center;}
  .inv-brand-name{font-family:'Cinzel', serif; font-size:21px; font-weight:600; letter-spacing:3px; color:var(--rose-deep);}
  .inv-brand-sub{font-family:'Cormorant Garamond', serif; font-style:italic; font-size:12.5px; letter-spacing:1px; color:var(--gold-deep); margin-top:5px;}
  .inv-title{text-align:right;}
  .inv-title h1{
    font-family:'Cinzel', serif; font-size:19px; margin:0 0 10px; color:var(--ink); font-weight:600;
    text-transform:uppercase; letter-spacing:2px;
    position:relative; display:inline-block; padding-bottom:8px;
  }
  .inv-title h1::after{
    content:""; position:absolute; right:0; bottom:0; width:70px; height:1.5px;
    background:var(--gold);
  }
  .inv-title div{font-size:12px; color:var(--ink-soft); font-weight:400; line-height:1.9;}

  .inv-divider{
    display:flex; align-items:center; gap:14px;
    margin:20px 0 26px;
  }
  .inv-divider .ln{flex:1; height:1px; background:var(--gold);}
  .inv-divider .dot{width:5px; height:5px; border-radius:50%; background:var(--gold); flex:none;}

  .inv-cols{display:grid; grid-template-columns:1fr 1fr 1fr; gap:26px; margin:0 0 26px; font-size:12px;}
  .inv-cols h3{
    font-family:'Cinzel', serif; font-size:10px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--gold-deep); margin:0 0 10px; font-weight:600;
    padding-bottom:8px; border-bottom:1px solid var(--rose-pale);
  }
  .inv-cols p{margin:0 0 4px; color:var(--ink); line-height:1.75;}

  .inv-table{width:100%; border-collapse:collapse; font-size:12px; margin-top:4px;}
  .inv-table thead tr{background:var(--blush);}
  .inv-table th{border-bottom:1.5px solid var(--gold); padding:11px 9px; font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--rose-deep); text-align:left; font-weight:600;}
  .inv-table td{padding:12px 9px; border-bottom:1px solid var(--line); line-height:1.5;}
  .inv-table .num{text-align:right;}

  .inv-totals{width:280px; margin-left:auto; margin-top:22px; font-size:13px; background:var(--blush); border:1px solid var(--rose-pale); border-radius:8px; padding:16px 20px;}
  .inv-totals .r{display:flex; justify-content:space-between; padding:6px 0;}
  .inv-totals .r.grand{border-top:1px solid var(--gold); margin-top:8px; padding-top:13px; font-family:'Cinzel',serif; font-size:17px; color:var(--rose-deep); font-weight:600; letter-spacing:.4px;}

  .inv-words{
    text-align:center; font-family:'Cormorant Garamond', serif; font-style:italic; font-size:13.5px; color:var(--gold-deep);
    margin-top:26px; padding:12px 14px; border-top:1px solid var(--rose-pale); border-bottom:1px solid var(--rose-pale); line-height:1.6;
  }

  .inv-footer{margin-top:44px; display:flex; justify-content:space-between; align-items:flex-end; font-size:11px; color:var(--ink-soft); gap:24px;}
  .inv-thanks{font-family:'Cormorant Garamond', serif; font-style:italic; font-size:13.5px; text-align:right; max-width:300px; line-height:1.8; color:var(--rose-deep);}
  .inv-thanks .small{display:block; font-family:'Poppins',sans-serif; font-style:normal; font-size:10px; color:var(--ink-soft); margin-top:8px; line-height:1.6;}
  .sig-block{width:200px;}
  .sig-img{display:block; height:52px; width:auto; max-width:200px; object-fit:contain; object-position:left bottom; margin-bottom:2px;}
  .sig-line{border-top:1px solid var(--ink-soft); padding-top:8px; font-size:10.5px; line-height:1.6;}

  @media print{
    @page{ size:A4; margin:0; }
    body *{visibility:hidden;}
    #invoiceOverlay, #invoiceOverlay *{visibility:visible;}
    #invoiceOverlay{position:absolute; inset:0; background:#fff; padding:0;}
    .invoice-toolbar{display:none;}
    .invoice-modal{box-shadow:none; max-width:100%; border-radius:0; background:#fff;}
    .invoice-doc{padding:0;}
    .inv-frame{border:none; width:210mm; min-height:297mm;}
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--rose-deep); color:#fff; padding:11px 22px; border-radius:24px;
    font-size:13px; z-index:200; opacity:0; transition:opacity .25s; pointer-events:none;
    box-shadow:0 6px 16px rgba(0,0,0,0.25);
  }
  .toast.show{opacity:1;}

  .code-pill{
    font-family:"Courier New", monospace;
    background:var(--cream-deep);
    padding:3px 9px;
    border-radius:20px;
    letter-spacing:1px;
    font-weight:700;
    color:var(--rose-deep);
    border:1px solid var(--gold-light);
    font-size:12px;
  }
  .loading-note{padding:70px 20px; text-align:center; color:var(--ink-soft); font-family:'Cormorant Garamond', serif; font-size:17px; font-style:italic;}
</style>
</head>
<body>

<header class="brandbar">
  <div class="brand">
    <div class="monogram"><span>UL</span></div>
    <div>
      <div class="brand-word">UTKAL LAXMI</div>
      <div class="brand-sub">Handloom of Odisha</div>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="invoice">New Invoice</button>
    <button class="tab-btn" data-tab="products">Products</button>
    <button class="tab-btn" data-tab="coupons">Coupons</button>
    <button class="tab-btn" data-tab="history">Invoice Backup</button>
  </nav>
</header>
<div class="hairline"></div>

<main id="app">
  <div class="loading-note" id="loadingNote">Loading your shop data…</div>
</main>

<div class="toast" id="toast"></div>

<!-- Printable Invoice Overlay -->
<div id="invoiceOverlay">
  <div class="invoice-modal">
    <div class="invoice-toolbar">
      <button class="btn btn-outline btn-sm" onclick="closeInvoiceModal()">Close</button>
      <button class="btn btn-gold btn-sm" onclick="window.print()">🖨 Print / Save PDF</button>
    </div>
    <div class="invoice-doc" id="invoiceDoc"></div>
  </div>
</div>

<script>
/* ---------------------------------------------------------
   UTKAL LAXMI — Invoice System
   Data model persisted via window.storage (personal, per-user)
--------------------------------------------------------- */

let products = [];
let coupons = [];
let invoices = [];

// ---- Backend connection settings ----
// Point this at your deployed backend (see utkal-laxmi-backend/README.md).
const API_BASE_URL = "http://localhost:4000"; // e.g. "https://api.utkallaxmi.com"
// If you set API_KEY in the backend's .env, put the same value here.
const API_KEY = ""; // e.g. "a-long-random-string"

async function loadKey(key){
  try{
    const res = await fetch(`${API_BASE_URL}/api/kv/${encodeURIComponent(key)}`, {
      headers: API_KEY ? { "x-api-key": API_KEY } : {}
    });
    if(res.status === 404) return [];
    if(!res.ok) throw new Error(`Load failed (${res.status})`);
    const data = await res.json();
    return data.value ?? [];
  }catch(e){
    console.error("loadKey error:", e);
    showToast("Could not reach the server — showing empty data.");
    return [];
  }
}
async function saveKey(key, val){
  try{
    const res = await fetch(`${API_BASE_URL}/api/kv/${encodeURIComponent(key)}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        ...(API_KEY ? { "x-api-key": API_KEY } : {})
      },
      body: JSON.stringify({ value: val })
    });
    if(!res.ok) throw new Error(`Save failed (${res.status})`);
  }catch(e){
    console.error("saveKey error:", e);
    showToast("Could not save — please retry.");
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function uid(prefix){
  return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

function money(n){
  return '₹' + Number(n).toLocaleString('en-IN', {maximumFractionDigits:2});
}

/* ---------------- Init ---------------- */
async function init(){
  [products, coupons, invoices] = await Promise.all([
    loadKey('ul_products'), loadKey('ul_coupons'), loadKey('ul_invoices')
  ]);
  renderApp();
}

function renderApp(){
  document.getElementById('app').innerHTML = `
    <section class="panel active" id="panel-invoice">${invoiceTabHTML()}</section>
    <section class="panel" id="panel-products">${productsTabHTML()}</section>
    <section class="panel" id="panel-coupons">${couponsTabHTML()}</section>
    <section class="panel" id="panel-history">${historyTabHTML()}</section>
  `;
  wireTabButtons();
  wireInvoiceTab();
  wireProductsTab();
  wireCouponsTab();
  wireHistoryTab();
  renderItemsTable();
}

function wireTabButtons(){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    });
  });
}

function wireInvoiceTab(){
  const dateEl = document.getElementById('orderDate');
  if(dateEl) dateEl.value = new Date().toISOString().slice(0,10);

  const addBtn = document.getElementById('addItemBtn');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      const sel = document.getElementById('productSelect');
      const qty = parseInt(document.getElementById('qtyInput').value, 10) || 1;
      if(!sel.value){ showToast('Choose a product first.'); return; }
      const prod = products.find(p=>p.id===sel.value);
      if(!prod) return;
      const existing = currentItems.find(i=>i.productId===prod.id);
      if(existing){ existing.qty += qty; }
      else { currentItems.push({productId:prod.id, name:prod.name, price:prod.price, qty}); }
      sel.value=''; document.getElementById('qtyInput').value=1;
      renderItemsTable();
    });
  }
  const applyBtn = document.getElementById('applyCouponBtn');
  if(applyBtn){
    applyBtn.addEventListener('click', ()=>{
      const code = document.getElementById('couponInput').value.trim().toUpperCase();
      const msgEl = document.getElementById('couponMsg');
      if(!code){ appliedCoupon=null; msgEl.textContent=''; renderItemsTable(); return; }
      const coupon = coupons.find(c=>c.code.toUpperCase()===code);
      if(!coupon){ appliedCoupon=null; msgEl.textContent='Invalid coupon code.'; msgEl.className='coupon-msg bad'; renderItemsTable(); return; }
      if(!coupon.active){ appliedCoupon=null; msgEl.textContent='This coupon is inactive.'; msgEl.className='coupon-msg bad'; renderItemsTable(); return; }
      if(coupon.expiry && coupon.expiry < new Date().toISOString().slice(0,10)){ appliedCoupon=null; msgEl.textContent='This coupon has expired.'; msgEl.className='coupon-msg bad'; renderItemsTable(); return; }
      appliedCoupon = coupon;
      msgEl.textContent = coupon.type==='percent' ? `Applied: ${coupon.value}% off` : `Applied: ${money(coupon.value)} off`;
      msgEl.className='coupon-msg ok';
      renderItemsTable();
    });
  }
  const genBtn = document.getElementById('generateInvoiceBtn');
  if(genBtn){
    genBtn.addEventListener('click', generateInvoice);
  }
}

function renderItemsTable(){
  const tbody = document.getElementById('itemsTbody');
  if(!tbody) return;
  if(currentItems.length===0){
    tbody.innerHTML = `<tr class="empty-row"><td colspan="5">No items added yet.</td></tr>`;
  } else {
    tbody.innerHTML = currentItems.map((it,idx)=>`
      <tr>
        <td>${escapeHtml(it.name)}</td>
        <td class="num">${it.qty}</td>
        <td class="num">${money(it.price)}</td>
        <td class="num">${money(it.price*it.qty)}</td>
        <td><button class="btn-danger" onclick="removeItem(${idx})">Remove</button></td>
      </tr>
    `).join('');
  }
  const totalsBox = document.getElementById('totalsBox');
  if(totalsBox){
    const {subtotal, discount, shipping, total} = computeTotals();
    totalsBox.innerHTML = `
      <div class="row"><span>Subtotal</span><span>${money(subtotal)}</span></div>
      ${discount>0 ? `<div class="row discount"><span>Discount${appliedCoupon?' ('+appliedCoupon.code+')':''}</span><span>&minus; ${money(discount)}</span></div>` : ''}
      <div class="row"><span>Shipping</span><span>${money(shipping)}</span></div>
      <div class="row total"><span>Total</span><span>${money(total)}</span></div>
    `;
  }
}

function removeItem(idx){
  currentItems.splice(idx,1);
  renderItemsTable();
}

function computeTotals(){
  const subtotal = currentItems.reduce((s,i)=>s+i.price*i.qty,0);
  let discount = 0;
  if(appliedCoupon){
    discount = appliedCoupon.type==='percent' ? subtotal*appliedCoupon.value/100 : appliedCoupon.value;
    discount = Math.min(discount, subtotal);
  }
  const shippingEl = document.getElementById('deliveryType');
  const shipping = shippingEl ? parseFloat(shippingEl.value)||0 : 0;
  const total = Math.max(0, subtotal - discount + shipping);
  return {subtotal, discount, shipping, total};
}

async function generateInvoice(){
  const name = document.getElementById('custName').value.trim();
  if(!name){ showToast('Please enter the customer name.'); return; }
  if(currentItems.length===0){ showToast('Add at least one item before generating.'); return; }

  const {subtotal, discount, shipping, total} = computeTotals();
  const invNo = 'UL-' + new Date().getFullYear() + '-' + String(invoices.length+1).padStart(4,'0');
  const invoice = {
    id: uid('inv_'),
    invoiceNo: invNo,
    date: document.getElementById('orderDate').value || new Date().toISOString().slice(0,10),
    customer: {
      name,
      phone: document.getElementById('custPhone').value.trim(),
      address: document.getElementById('custAddr').value.trim(),
      email: document.getElementById('custEmail').value.trim()
    },
    paymentMode: document.getElementById('paymentMode').value,
    deliveryLabel: document.getElementById('deliveryType').selectedOptions[0].textContent,
    items: currentItems.map(i=>({...i})),
    subtotal, discount, shipping, total,
    couponCode: appliedCoupon ? appliedCoupon.code : null,
    createdAt: new Date().toISOString()
  };
  invoices.push(invoice);
  await saveKey('ul_invoices', invoices);

  // reset form
  currentItems = [];
  appliedCoupon = null;
  showToast('Invoice generated and saved to your backup.');
  renderApp();
  document.querySelector('.tab-btn[data-tab="invoice"]').click();
  openInvoiceModal(invoice);
}

function randomCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='UL';
  for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function wireCouponsTab(){
  renderCouponsTable();
  const genBtn = document.getElementById('genCodeBtn');
  if(genBtn) genBtn.addEventListener('click', ()=>{
    document.getElementById('cCode').value = randomCode();
  });
  const addBtn = document.getElementById('addCouponBtn');
  if(addBtn) addBtn.addEventListener('click', async ()=>{
    const code = document.getElementById('cCode').value.trim().toUpperCase();
    const type = document.getElementById('cType').value;
    const value = parseFloat(document.getElementById('cValue').value);
    const expiry = document.getElementById('cExpiry').value || null;
    if(!code || isNaN(value)){ showToast('Enter a code and value.'); return; }
    if(coupons.some(c=>c.code.toUpperCase()===code)){ showToast('That code already exists.'); return; }
    coupons.push({id:uid('c_'), code, type, value, expiry, active:true});
    await saveKey('ul_coupons', coupons);
    showToast('Coupon created.');
    renderApp();
    document.querySelector('.tab-btn[data-tab="coupons"]').click();
  });
}

function renderCouponsTable(){
  const tbody = document.getElementById('couponsTbody');
  if(!tbody) return;
  if(coupons.length===0){
    tbody.innerHTML = `<tr class="empty-row"><td colspan="6">No coupons yet.</td></tr>`;
    return;
  }
  tbody.innerHTML = coupons.map(c=>`
    <tr>
      <td><span class="code-pill">${escapeHtml(c.code)}</span></td>
      <td>${c.type==='percent'?'Percentage':'Flat'}</td>
      <td class="num">${c.type==='percent'? c.value+'%' : money(c.value)}</td>
      <td>${c.expiry||'—'}</td>
      <td><span class="tag ${c.active?'active':'inactive'}">${c.active?'Active':'Inactive'}</span></td>
      <td style="display:flex; gap:6px;">
        <button class="btn btn-outline btn-sm" onclick="toggleCoupon('${c.id}')">${c.active?'Deactivate':'Activate'}</button>
        <button class="btn-danger" onclick="deleteCoupon('${c.id}')">Delete</button>
      </td>
    </tr>
  `).join('');
}

async function toggleCoupon(id){
  const c = coupons.find(c=>c.id===id);
  if(c) c.active = !c.active;
  await saveKey('ul_coupons', coupons);
  renderApp();
  document.querySelector('.tab-btn[data-tab="coupons"]').click();
}
async function deleteCoupon(id){
  coupons = coupons.filter(c=>c.id!==id);
  await saveKey('ul_coupons', coupons);
  showToast('Coupon deleted.');
  renderApp();
  document.querySelector('.tab-btn[data-tab="coupons"]').click();
}

function formatDate(d){

/* ---------- number to words (Indian system) ---------- */
function numberToWords(num){
  if(num === 0) return 'Zero';
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
    'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

  function twoDigit(n){
    if(n<20) return ones[n];
    return tens[Math.floor(n/10)] + (n%10? ' '+ones[n%10] : '');
  }
  function threeDigit(n){
    if(n<100) return twoDigit(n);
    return ones[Math.floor(n/100)] + ' Hundred' + (n%100 ? ' ' + twoDigit(n%100) : '');
  }
  let parts = [];
  let crore = Math.floor(num / 10000000); num %= 10000000;
  let lakh = Math.floor(num / 100000); num %= 100000;
  let thousand = Math.floor(num / 1000); num %= 1000;
  let hundred = num;

  if(crore) parts.push(threeDigit(crore) + ' Crore');
  if(lakh) parts.push(threeDigit(lakh) + ' Lakh');
  if(thousand) parts.push(threeDigit(thousand) + ' Thousand');
  if(hundred) parts.push(threeDigit(hundred));

  return parts.join(' ');
}

function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
